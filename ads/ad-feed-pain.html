<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Inter:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1350px; overflow: hidden; background: #070707; }
    .stage { position: relative; width: 1080px; height: 1350px; }
    .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; }
    .shade {
      position: absolute; inset: 0;
      background:
        linear-gradient(180deg, rgba(7,7,7,.15) 0%, rgba(7,7,7,.1) 32%, rgba(7,7,7,.55) 58%, rgba(7,7,7,.96) 100%);
    }
    .copy { position: absolute; left: 56px; right: 56px; bottom: 72px; color: #fff; }
    .kicker {
      display: inline-block;
      background: #ffe500;
      color: #111;
      font-family: Inter, Arial, sans-serif;
      font-weight: 900;
      font-size: 28px;
      letter-spacing: .18em;
      text-transform: uppercase;
      padding: 10px 16px;
      margin-bottom: 22px;
    }
    h1 {
      font-family: Anton, Impact, sans-serif;
      font-size: 118px;
      line-height: .88;
      letter-spacing: .01em;
      text-transform: uppercase;
      text-shadow: 0 4px 0 #000;
    }
    h1 em { color: #ffe500; font-style: normal; }
    p.sub {
      margin-top: 28px;
      font-family: Inter, Arial, sans-serif;
      font-weight: 800;
      font-size: 34px;
      line-height: 1.25;
      color: #f2f2f2;
    }
    .brand {
      margin-top: 36px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand img { width: 72px; height: 72px; border-radius: 18px; border: 3px solid #ffe500; }
    .brand span {
      font-family: Inter, Arial, sans-serif;
      font-weight: 900;
      font-size: 32px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .brand small {
      display: block;
      font-size: 22px;
      font-weight: 800;
      color: #ffe500;
      letter-spacing: .08em;
    }
  </style>
</head>
<body>
  <div class="stage">
    <img class="bg" src="assets/caderno.jpg" alt="" />
    <div class="shade"></div>
    <div class="copy">
      <div class="kicker">Pra quem vende lanche</div>
      <h1>LEVOU NO<br>FIADO E<br><em>SUMIU?</em></h1>
      <p class="sub">Anota em 1 toque. Cobra no Zap.<br>Só baixa o estoque quando o Pix cair.</p>
      <div class="brand">
        <img src="assets/icon.png" alt="" />
        <span>Pix da Confiança<small>grátis no celular</small></span>
      </div>
    </div>
  </div>
</body>
</html>
