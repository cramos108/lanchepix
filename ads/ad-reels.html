<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #070707; }
    .stage { position: relative; width: 1080px; height: 1920px; }
    .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 55% 40%; }
    .shade {
      position: absolute; inset: 0;
      background:
        linear-gradient(180deg,
          rgba(7,7,7,.55) 0%,
          rgba(7,7,7,.12) 22%,
          rgba(7,7,7,.2) 48%,
          rgba(7,7,7,.92) 78%);
    }
    .copy {
      position: absolute;
      left: 56px; right: 56px;
      top: 430px;
      color: #fff;
    }
    .kicker {
      display: inline-block;
      background: #ffe500;
      color: #111;
      font-family: Inter, Arial, sans-serif;
      font-weight: 900;
      font-size: 26px;
      letter-spacing: .18em;
      text-transform: uppercase;
      padding: 10px 16px;
      margin-bottom: 22px;
    }
    h1 {
      font-family: Anton, Impact, sans-serif;
      font-size: 128px;
      line-height: .86;
      text-transform: uppercase;
      text-shadow: 0 6px 24px rgba(0,0,0,.65);
    }
    h1 em { color: #ffe500; font-style: normal; }
    p.sub {
      margin-top: 28px;
      font-family: Inter, Arial, sans-serif;
      font-weight: 800;
      font-size: 36px;
      line-height: 1.25;
      max-width: 920px;
    }
    .cta {
      position: absolute;
      left: 56px; right: 56px;
      bottom: 280px;
    }
    .btn {
      display: block;
      text-align: center;
      background: #ffe500;
      color: #111;
      font-family: Inter, Arial, sans-serif;
      font-weight: 900;
      font-size: 36px;
      text-transform: uppercase;
      letter-spacing: .05em;
      padding: 26px 20px;
      border-radius: 22px;
    }
    .hint {
      margin-top: 18px;
      text-align: center;
      color: #ffe500;
      font-family: Inter, Arial, sans-serif;
      font-weight: 800;
      font-size: 26px;
    }
    .logo {
      position: absolute; top: 210px; left: 56px;
      display: flex; align-items: center; gap: 14px;
      color: #fff;
      font-family: Inter, Arial, sans-serif;
      font-weight: 900;
      font-size: 28px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .logo img { width: 64px; height: 64px; border-radius: 16px; border: 3px solid #ffe500; }
  </style>
</head>
<body>
  <div class="stage">
    <img class="bg" src="assets/street.jpg" alt="" />
    <div class="shade"></div>
    <div class="logo">
      <img src="assets/icon.png" alt="" />
      Pix da Confiança
    </div>
    <div class="copy">
      <div class="kicker">Cliente foi embora</div>
      <h1>O PIX<br>FICOU<br><em>COM VOCÊ?</em></h1>
      <p class="sub">Anota o fiado. Cobra no WhatsApp. Confirma quando o Pix cair.</p>
    </div>
    <div class="cta">
      <div class="btn">Manda FIADO no WhatsApp</div>
      <div class="hint">grátis · abre no celular</div>
    </div>
  </div>
</body>
</html>
